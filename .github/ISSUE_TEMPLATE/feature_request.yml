name: Feature request
description: Suggest an improvement to a Commons tool, schema or document.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Commons is maintained on a best-effort basis; requests are welcome but there is no commitment to implement them.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
